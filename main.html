<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impact of Wealth vs Education on University Locations</title>
    <script src="https://d3js.org/d3.v5.js"></script>
    <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
    <script src="https://d3js.org/topojson.v3.js"></script>
    <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<h1>Wealth vs Education - What has a Bigger Impact on Top University Locations?</h1>
<div id="parameter-selectors">
    <div id="rank-selectors">
        <label>
            <input type="radio" name="rank-selector" value="the" checked="checked">
            THE University Rankings (Top 200)
        </label>
        <label>
            <input type="radio" name="rank-selector" value="scimago">
            SCImago Research Rankings
        </label>
    </div>
    <div class="select-group">
        <label for="indicator-selectors">Indicators</label>
        <select id="indicator-selectors">
            <optgroup label="Wealth">
                <option value="gdp">GDP per capita</option>
                <option value="gni">GNI per capita</option>
            </optgroup>
            <optgroup label="Education">
                <option value="gov_spend">Government Expenditure on Education (% of GDP)</option>
                <option value="lit_rate">Literacy Rate (Adult)</option>
                <option value="pri_comp">Completion Rate (Primary)</option>
                <option value="pri_pupil_teacher">Pupil: Teacher (Primary)</option>
                <option value="sec_pupil_teacher">Pupil: Teacher (Secondary)</option>
                <option value="pri_enrol">Enrolment Rate (Primary)</option>
                <option value="sec_enrol">Enrolment Rate (Secondary)</option>
                <option value="ter_enrol">Enrolment Rate (Tertiary)</option>
            </optgroup>
        </select>
    </div>
</div>
<div id="map-scale-container">
    <div id="main-map-container">
        <svg id="main-map-frame"></svg>
    </div>
    <div id="scale">
        <div id="scale-title"></div>
        <table id="scale-bins">
            <tbody></tbody>
        </table>
    </div>
</div>
<div id="time-controls">
    <button id="play-btn">&#9654;</button>
    <input type="range" id="timeline" min="2011" max="2023" step="1" value="2011">
    <span id="year-display">2011</span>
</div>
<div id="tooltip">
    <div class="tt-country"></div>
    <div class="tt-value"></div>
</div>
<script src="js/config.js"></script>
<script src="js/dataLoading.js"></script>
<script src="js/map.js"></script>
<script src="js/tooltip.js"></script>
<script src="js/scale.js"></script>
<script src="js/listeners.js"></script>
</body>
</html>
