<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impact of Wealth vs Education on University Locations</title>
    <script src="https://d3js.org/d3.v5.js"></script>
    <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
    <script src="https://d3js.org/topojson.v3.js"></script>
    <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
    <div id="header">
        <h1>Wealth vs Education - What has a Bigger Impact on Top University Locations?</h1>
        <a id="data-pg-btn" href="data.html">Data Processing and Sources</a>
    </div>
    <div id="parameter-selectors">
        <div id="rank-selectors">
            <label>
                <input type="radio" name="rank-selector" value="the" checked="checked">
                THE University Rankings (Top 200)
            </label>
            <label>
                <input type="radio" name="rank-selector" value="scimago">
                SCImago Research Rankings
            </label>
        </div>
        <div class="select-group">
            <label for="indicator-selectors">Indicators</label>
            <select id="indicator-selectors">
                <optgroup label="Wealth">
                    <option value="gdp">GDP per capita</option>
                    <option value="gni">GNI per capita</option>
                </optgroup>
                <optgroup label="Education">
                    <option value="gov_spend">Government Expenditure on Education (% of GDP)</option>
                    <option value="lit_rate">Literacy Rate (Adult)</option>
                    <option value="pri_comp">Completion Rate (Primary)</option>
                    <option value="pri_pupil_teacher">Pupil: Teacher (Primary)</option>
                    <option value="sec_pupil_teacher">Pupil: Teacher (Secondary)</option>
                    <option value="pri_enrol">Enrolment Rate (Primary)</option>
                    <option value="sec_enrol">Enrolment Rate (Secondary)</option>
                    <option value="ter_enrol">Enrolment Rate (Tertiary)</option>
                </optgroup>
            </select>
        </div>
    </div>
    <div id="map-scale-container">
        <div id="main-map-container">
            <svg id="main-map-frame"></svg>
        </div>
        <div id="scale">
            <div id="scale-title"></div>
            <table id="scale-bins">
                <tbody></tbody>
            </table>
        </div>
    </div>
    <div id="time-controls">
        <button id="play-btn">&#9654;</button>
        <input type="range" id="timeline" min="2011" max="2023" step="1" value="2011">
        <span id="year-display">2011</span>
    </div>
    <div id="tooltip">
        <div class="tt-country"></div>
        <div class="tt-value"></div>
    </div>
<script type="text/javascript">
    let datasets = {};
    let centres = new Map();
    let countryNames = new Map();
    let container = document.getElementById("main-map-container");
    let svg = d3.select("#main-map-frame");
    let tooltip = document.getElementById("tooltip");
    let timeline = document.getElementById("timeline");
    let yearDisplay = document.getElementById("year-display");
    let playBtn = document.getElementById("play-btn");
    let playRange = null;
    const HEIGHT_RATIO = 0.5;
    const SCALE = 6.5;
    let projection, path, colourMap;
    let currentIndicator = "gdp";
    const theRadiusScale = d3.scaleSqrt().domain([1, 200]).range([9, 2]);

    const INDICATORS = {
        gdp: {
            label: "GDP per capita",
            scheme: ["#feebe2", "#fbb4b9", "#f768a1", "#c51b8a", "#7a0177"],
            scale: "threshold",
            bins: [1135, 4465, 13845, 50000],
            format: d => "$" + d3.format(",.2f")(d)
        },
        gni: {
            label: "GNI per capita",
            scheme: ["#f1eef6", "#d7b5d8", "#df65b0", "#dd1c77", "#980043"],
            scale: "threshold",
            bins: [1135, 4465, 13845, 50000],
            format: d => "$" + d3.format(",.2f")(d)
        },
        gov_spend: {
            label: "Government Expenditure on Education (% of GDP)",
            scheme: ["#edf8fb", "#b3cde3", "#8c96c6", "#8856a7", "#810f7c"],
            scale: "threshold",
            bins: [2, 4, 6, 8],
            format: d3.format(".2f")
        },
        lit_rate: {
            label: "Literacy Rate (Adult)",
            scheme: ["#ffffcc", "#c2e699", "#78c679", "#31a354", "#006837"],
            scale: "threshold",
            bins: [30, 50, 65, 85],
            format: d3.format(".2f")
        },
        pri_comp:{
            label: "Completion Rate (Primary)",
            scheme: ["#f6eff7", "#bdc9e1", "#67a9cf", "#1c9099", "#016c59"],
            scale: "threshold",
            bins: [50, 75, 95, 100],
            format: d3.format(".2f")
        },
        pri_pupil_teacher: {
            label: "Pupil: Teacher (Primary)",
            scheme: ["#ffffb2", "#fecc5c", "#fd8d3c", "#f03b20", "#bd0026"],
            scale: "threshold",
            bins: [20, 35, 50, 70],
            format: d3.format(".2f")
        },
        sec_pupil_teacher: {
            label: "Pupil: Teacher (Secondary)",
            scheme: ["#fef0d9", "#fdcc8a", "#fc8d59", "#e34a33", "#b30000"],
            scale: "threshold",
            bins: [20, 35, 50, 70],
            format: d3.format(".2f")
        },
        pri_enrol: {
            label: "Enrolment Rate (Primary)",
            scheme: ["#ffffcc", "#a1dab4", "#41b6c4", "#2c7fb8", "#253494"],
            scale: "threshold",
            bins: [75, 90, 100, 110],
            format: d3.format(".2f")
        },
        sec_enrol: {
            label: "Enrolment Rate (Secondary)",
            scheme: ["#f0f9e8", "#bae4bc", "#7bccc4", "#43a2ca", "#0868ac"],
            scale: "threshold",
            bins: [40, 65, 85, 100],
            format: d3.format(".2f")
        },
        ter_enrol: {
            label: "Enrolment Rate (Tertiary)",
            scheme: ["#f1eef6", "#bdc9e1", "#74a9cf", "#2b8cbe", "#045a8d"],
            scale: "threshold",
            bins: [10, 25, 50, 75],
            format: d3.format(".2f")
        },
    };

    // Load all required data once on start up
    async function loadData() {
        const [gdp, gni, education, the, scimago] = await Promise.all([
            d3.csv("data/gdp-per-capita-worldbank.csv"),
            d3.csv("data/gross-national-income-per-capita-worldbank.csv"),
            d3.csv("data/world-education-data.csv"),
            d3.csv("data/the_combined.csv"),
            d3.csv("data/scimago_combined.csv")
        ]);
        datasets.the = formatTHEData(the)
        datasets.scimago = formatScimagoData(scimago)
        datasets.gdp = formatData(gdp, "numeric_code", "Year", "GDP per capita")
        datasets.gni = formatData(gni, "numeric_code", "Year", "GNI per capita")
        datasets.gov_spend = formatData(education, "numeric_code", "year", "gov_exp_pct_gdp")
        datasets.lit_rate    = formatData(education, "numeric_code", "year", "lit_rate_adult_pct");
        datasets.pri_comp    = formatData(education, "numeric_code", "year", "pri_comp_rate_pct");
        datasets.pri_pupil_teacher = formatData(education, "numeric_code", "year", "pupil_teacher_primary");
        datasets.sec_pupil_teacher = formatData(education, "numeric_code", "year", "pupil_teacher_secondary");
        datasets.pri_enrol   = formatData(education, "numeric_code", "year", "school_enrol_primary_pct");
        datasets.sec_enrol   = formatData(education, "numeric_code", "year", "school_enrol_secondary_pct");
        datasets.ter_enrol   = formatData(education, "numeric_code", "year", "school_enrol_tertiary_pct");
    }

    // Data formatting for indicators: Map(#ISO -> (year -> val))
    function formatData(data, isoCol, yearCol, valCol){
        const dataMap = new Map();
        data.forEach(d => {
            let iso = d[isoCol];
            let year = +d[yearCol];
            let val = d[valCol] === "" ? null : +d[valCol];
            if (!iso || isNaN(year) || val === null) return;
            if (!dataMap.has(iso)) dataMap.set(iso, new Map());
            dataMap.get(iso).set(year, val);
        });
        return dataMap;
    }

    // Data formatting for THE: Map(year -> [ISO, uniName, rank, latitude, longitude])
    function formatTHEData(data){
        const dataMap = new Map();
        data.forEach(d => {
            let year = +d.year;
            let lat = +d.lat;
            let lon = +d.lon;
            if (isNaN(year) || isNaN(lat) || isNaN(lon)) return;
            if (!dataMap.has(year)) dataMap.set(year, []);
            dataMap.get(year).push({
                name: d.name,
                iso: d.numeric_code,
                rank: +d.rank,
                lat: lat,
                lon: lon,
            })
        })
        return dataMap;
    }

    // Data formatting for SCImago: Map(year -> [ISO, rank])
    function formatScimagoData(data){
        const dataMap = new Map();
        data.forEach(d => {
            let year = +d.year;
            if (isNaN(year)) return;
            if (!dataMap.has(year)) dataMap.set(year, []);
            dataMap.get(year).push({
                iso: d.numeric_code,
                rank: +d.rank,
            })
        })
        return dataMap;
    }

    function createColourMap(indicator){
        const selectedIndicator = INDICATORS[indicator];
        const dataset = datasets[indicator];
        const data = [];
        dataset.forEach(yearMap => {yearMap.forEach(d => {data.push(d)})});
        return d3.scaleThreshold().domain(selectedIndicator.bins).range(selectedIndicator.scheme)
    }

    // Draws Winkel Triple Choropleth Map
    async function drawMap() {
        let width  = container.clientWidth;
        let height = width * HEIGHT_RATIO;
        svg.attr("height", height);

        projection = d3.geoWinkel3()
            .scale(width / SCALE)
            .translate([width / 2, height / 2]);

        path = d3.geoPath().projection(projection);

        const [countriesTopo] = await Promise.all([
            d3.json("data/countries-50m.json"),
            loadData()
        ]);
        const countries = topojson.feature(countriesTopo, countriesTopo.objects.countries);

        // Calculate centre point of each country for SCImago
        countries.features.forEach(d => {
            const id = String(d.id).padStart(3, "0");
            countryNames.set(id, d.properties.name);
            const centre = d3.geoCentroid(d);
            if (!isNaN(centre[0])) centres.set(id, centre);
        })
        colourMap = createColourMap(currentIndicator);

        svg.append("defs").append("pattern")
            .attr("id", "null-pattern")
            .attr("patternUnits", "userSpaceOnUse")
            .attr("width", 4)
            .attr("height", 4)
            .append("line")
            .attr("x1", 0).attr("y1", 0)
            .attr("x2", 4).attr("y2", 4)
            .attr("stroke", "#aaa")
            .attr("stroke-width", 1)

        d3.select("#main-map-frame").selectAll("path")
        .data(countries.features)
            .join("path")
            .attr("d", path)
            .attr("fill", d => {
                const id  = String(d.id).padStart(3, "0");
                const val = datasets[currentIndicator].get(id)?.get(+timeline.value);
                return val == null ? "url(#null-pattern)" : colourMap(val);
            })
            .on("mouseover", d => showCountryTooltip(d))
            .on("mousemove", () => moveTooltip())
            .on("mouseleave", () => hideTooltip());
        updateMarkers();
        createScale();
    }

    function update(){
        updateMap();
        updateMarkers();
    }

    function updateMap() {
        const year    = +timeline.value;
        const lookup  = datasets[currentIndicator];

        svg.selectAll("path")
            .transition()
            .duration(200)
            .attr("fill", d => {
                // get numeric code from world-atlas TopoJSON
                const id  = String(d.id).padStart(3, "0");
                const val = lookup.get(id)?.get(year);
                return val == null ? "url(#null-pattern)" : colourMap(val);
            });
    }

    function updateMarkers() {
        const year   = +timeline.value;
        const source = document.querySelector("input[name='rank-selector']:checked").value;

        svg.selectAll("circle.marker").remove();

        if (source === "the") {
            let uniRank = datasets.the.get(year) ?? [];
            svg.selectAll("circle.marker")
                .data(uniRank)
                .join("circle")
                .attr("class", "marker")
                .attr("cx", d => projection([d.lon, d.lat])[0])
                .attr("cy", d => projection([d.lon, d.lat])[1])
                .attr("r",  d => theRadiusScale(d.rank))
                .on("mouseover", showTHETooltip)
                .on("mousemove", moveTooltip)
                .on("mouseleave", hideTooltip);
        } else {
            const countries = datasets.scimago.get(year) ?? [];
            numRanks = d3.max(countries, d => d.rank)
            const scimagoRadiusScale = d3.scaleSqrt().domain([1, numRanks]).range([11, 3]);
            svg.selectAll("circle.marker")
                .data(countries.filter(d => centres.has(d.iso)))
                .join("circle")
                .attr("class", "marker")
                .attr("cx", d => projection(centres.get(d.iso))[0])
                .attr("cy", d => projection(centres.get(d.iso))[1])
                .attr("r",  d => scimagoRadiusScale(d.rank))
                .on("mouseover", showScimagoTooltip)
                .on("mousemove", moveTooltip)
                .on("mouseleave", hideTooltip);
        }
    }

    function showCountryTooltip(d) {
        const iso    = String(d.id).padStart(3, "0");
        const val   = datasets[currentIndicator].get(iso)?.get(+timeline.value);
        const name  = countryNames.get(iso) ?? "Unknown";
        const indicator = INDICATORS[currentIndicator];

        tooltip.querySelector(".tt-country").textContent = name;
        tooltip.querySelector(".tt-value").innerHTML = val != null
            ? `<strong>${indicator.label}:</strong> ${indicator.format(val)}`
            : `<span class="tt-null">No data collected</span>`;

        moveTooltip();
        tooltip.classList.add("visible");
    }

    function showTHETooltip(d) {
        tooltip.querySelector(".tt-country").textContent = d.name;
        tooltip.querySelector(".tt-value").innerHTML = `<strong>THE Rank:</strong> #${d.rank}`;
        moveTooltip();
        tooltip.classList.add("visible");
    }

    function showScimagoTooltip(d) {
        tooltip.querySelector(".tt-country").textContent = countryNames.get(d.iso) ?? "Unknown";
        tooltip.querySelector(".tt-value").innerHTML = `<strong>SCImago Rank:</strong> #${d.rank}`;
        moveTooltip();
        tooltip.classList.add("visible");
    }

    function moveTooltip() {
        const pad = 12;
        let x = d3.event.clientX + pad;
        let y = d3.event.clientY + pad;
        // Prevent overflow off the right/bottom edge
        if (x + 230 > window.innerWidth)  x = d3.event.clientX - 230;
        if (y + 80  > window.innerHeight) y = d3.event.clientY - 80;
        tooltip.style.left = x + "px";
        tooltip.style.top  = y + "px";
    }

    function hideTooltip() {tooltip.classList.remove("visible");}

    // Resizes map on screen resize
    function resizeMap() {
        let width  = container.clientWidth;
        let height = width * HEIGHT_RATIO;
        svg.attr("height", height);

        projection
            .scale(width / SCALE)
            .translate([width / 2, height / 2]);

        svg.selectAll("path").attr("d", path);
        updateMarkers();
    }

    function createScale() {
        const indicator = INDICATORS[currentIndicator];
        document.getElementById("scale-title").textContent = indicator.label;
        const tbody = document.querySelector("#scale-bins tbody");
        tbody.innerHTML = "";

        const dollarFmt = d3.format(",.0f");

        if (indicator.scale === "threshold") {
            // Bins define the boundaries — build one label per colour band
            const boundaries = [0, ...indicator.bins, Infinity];
            indicator.scheme.forEach((colour, i) => {
                const low = boundaries[i];
                const high = boundaries[i + 1];
                const label = high === Infinity
                    ? `> ${dollarFmt(low)}`
                    : low === 0
                        ? `< ${dollarFmt(high)}`
                        : `${dollarFmt(low)} – ${dollarFmt(high)}`;
                tbody.appendChild(makeRow(colour, label));
            });
        } else {
            indicator.scheme.forEach(colour => {
                const [low, high] = colourMap.invertExtent(colour);
                tbody.appendChild(makeRow(colour, `${indicator.format(low)} – ${indicator.format(high)}`));
            });
        }

        // No data swatch
        tbody.appendChild(makeRow("url(null-pattern)", "No data"));
    }

    function makeRow(colour, label) {
        const tr = document.createElement("tr");
        const fill = colour.startsWith("url")
            ? `<svg width="18" height="28"><defs><pattern id="null-swatch" patternUnits="userSpaceOnUse" width="4" height="4">
                <line x1="0" y1="0" x2="4" y2="4" stroke="#aaa" stroke-width="1"/>
                    </pattern></defs><rect width="18" height="28" fill="url(#null-swatch)" stroke="#ccc" stroke-width="1"/></svg>`
            : `<svg width="18" height="28"><rect width="18" height="28" fill="${colour}" stroke="#ccc" stroke-width="1"/></svg>`;
        tr.innerHTML = `<td class="scale-swatch">${fill}</td><td class="scale-label">${label}</td>`;
        return tr;
    }

    document.getElementById("indicator-selectors").addEventListener("change", function() {
        currentIndicator = this.value;
        colourMap = createColourMap(currentIndicator);
        update();
        createScale();
    });

    // Writes year + changes data subset corresponding to timeline selection
    timeline.addEventListener("input", () => {
        stopPlaying()
        yearDisplay.textContent = timeline.value;
        update();
    });

    // Changes range of timeline depending on the ranking metric selected
    document.querySelectorAll("input[name='rank-selector']").forEach(radio => {
        radio.addEventListener("change", (e) => {
            stopPlaying()
            if (e.target.value === "scimago") {
                timeline.min = 1996;
            } else {
                timeline.min = 2011;
                if (+timeline.value < 2011) timeline.value = 2011;
            }
            yearDisplay.textContent = timeline.value;
            update();
        });
    });

    playBtn.addEventListener("click", () => {
        if (playRange){
            stopPlaying()
        }
        else{
            playBtn.innerHTML = "&#9646;&#9646;"
            playRange = setInterval(() => {
                let year = +timeline.value;
                let max = +timeline.max;
                let min = +timeline.min;
                if (year >= max) {
                    stopPlaying()
                    year = min;
                }
                else {
                    year += 1;
                }
                timeline.value = year;
                yearDisplay.textContent = year;
                update();
            }, 750)
        }
    });

    function stopPlaying(){
        clearInterval(playRange);
        playRange = null;
        playBtn.innerHTML = "&#9654;";
    }

    // Listener for window resizing
    const observer = new ResizeObserver(() => resizeMap());
    observer.observe(container);

    drawMap();

</script>
</body>
</html>
