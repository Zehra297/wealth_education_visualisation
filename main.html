<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impact of Wealth vs Education on Research Output</title>
    <script src="https://d3js.org/d3.v5.js"></script>
    <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
    <script src="https://d3js.org/topojson.v3.js"></script>
    <style>
        #main-map-container {
            width: 95%;
            margin: 0 auto;
        }
        svg {
            width: 100%;
            height: auto;
        }
        path {
            fill: #fff;
            stroke-width: 0.5px;
            stroke: #000;
        }
    </style>
</head>
<body>
    <h1>Wealth vs Education- What has a Bigger Impact on Top University Locations?</h1>
    <div id="main-map-container">
        <svg id="main-map"></svg>
    </div>
<script type="text/javascript">
    let container = document.getElementById("main-map-container");
    let svg = d3.select("#main-map");
    let projection, path;

    async function drawMap() {
        let width  = container.clientWidth;
        let height = width * 0.5;
        svg.attr("height", height);

        projection = d3.geoWinkel3()
            .scale(width / 6.5)
            .translate([width / 2, height / 2]);

        path = d3.geoPath().projection(projection);

        const countriesTopo = await d3.json("data/countries-50m.json");
        const countries = topojson.feature(countriesTopo, countriesTopo.objects.countries);
        d3.select("#main-map").selectAll("path")
        .data(countries.features)
            .join("path")
            .attr("d", path);
    }

    function resizeMap() {
        let width  = container.clientWidth;
        let height = width * 0.5;
        svg.attr("height", height);

        projection
            .scale(width / 6.5)
            .translate([width / 2, height / 2]);

        svg.selectAll("path").attr("d", path);
    }

    const observer = new ResizeObserver(() => resizeMap());
    observer.observe(container);

    drawMap();

</script>
</body>
</html>
